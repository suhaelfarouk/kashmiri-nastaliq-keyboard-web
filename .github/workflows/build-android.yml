name: Build Android APKs

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "apps/native/**"
      - ".github/workflows/build-android.yml"
  pull_request:
    paths:
      - "apps/native/**"
      - ".github/workflows/build-android.yml"

concurrency:
  group: build-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Flutter Android release APKs
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/native

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Require MANIFEST_PUBLIC_KEY_B64
        shell: bash
        run: |
          if [ -z "${{ secrets.MANIFEST_PUBLIC_KEY_B64 }}" ]; then
            echo "Add repository secret MANIFEST_PUBLIC_KEY_B64"
            echo "(contents of ~/.config/makhzan/ed25519_public.b64, no newlines)."
            exit 1
          fi

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build universal APK
        shell: bash
        run: |
          flutter build apk --release \
            --dart-define=MANIFEST_PUBLIC_KEY_B64="${{ secrets.MANIFEST_PUBLIC_KEY_B64 }}"

      - name: Build per-ABI APKs
        shell: bash
        run: |
          flutter build apk --release --split-per-abi \
            --dart-define=MANIFEST_PUBLIC_KEY_B64="${{ secrets.MANIFEST_PUBLIC_KEY_B64 }}"

      - name: Upload Android APKs
        uses: actions/upload-artifact@v5
        with:
          name: makhzan-android-apks
          path: apps/native/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
          retention-days: 14
